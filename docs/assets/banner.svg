<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="OptLens: see what the optimizer did, and whether it changed your program">
  <title>OptLens</title>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; white-space: pre; }
    .bar { transform-box: fill-box; transform-origin: left center; }
    .dyn { animation: loop 10s infinite; }
    @keyframes loop { 0% {opacity:0} 3% {opacity:1} 92.00% {opacity:1} 98.00% {opacity:0} 100% {opacity:0} }
    @keyframes type { 0% {width:0} 3.00% {width:0} 20.00% {width:422px} 100% {width:422px} }
    @keyframes caret { 0% {transform:translateX(0)} 3.00% {transform:translateX(0)} 20.00% {transform:translateX(422px)} 100% {transform:translateX(422px)} }
    @keyframes blink { 0%, 49% {opacity:1} 50%, 100% {opacity:0} }
    @keyframes fill0 { 0% {transform:scaleX(0)} 23.00% {transform:scaleX(0)} 30.50% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
    @keyframes show0 { 0% {opacity:0} 30.50% {opacity:0} 32.00% {opacity:1} 100% {opacity:1} }
    @keyframes fill1 { 0% {transform:scaleX(0)} 27.50% {transform:scaleX(0)} 35.00% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
    @keyframes show1 { 0% {opacity:0} 35.00% {opacity:0} 36.50% {opacity:1} 100% {opacity:1} }
    @keyframes fill2 { 0% {transform:scaleX(0)} 32.00% {transform:scaleX(0)} 39.50% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
    @keyframes show2 { 0% {opacity:0} 39.50% {opacity:0} 41.00% {opacity:1} 100% {opacity:1} }
    @keyframes fill3 { 0% {transform:scaleX(0)} 36.50% {transform:scaleX(0)} 44.00% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
    @keyframes show3 { 0% {opacity:0} 44.00% {opacity:0} 45.50% {opacity:1} 100% {opacity:1} }
    @keyframes fill4 { 0% {transform:scaleX(0)} 41.00% {transform:scaleX(0)} 48.50% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
    @keyframes show4 { 0% {opacity:0} 48.50% {opacity:0} 50.00% {opacity:1} 100% {opacity:1} }
    @keyframes fill5 { 0% {transform:scaleX(0)} 45.50% {transform:scaleX(0)} 53.00% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
    @keyframes show5 { 0% {opacity:0} 53.00% {opacity:0} 54.50% {opacity:1} 100% {opacity:1} }
    @keyframes flag { 0% {opacity:0} 58.00% {opacity:0} 61.00% {opacity:1} 100% {opacity:1} }
    @keyframes verdict { 0% {opacity:0; transform:translateY(8px)} 64.00% {opacity:0; transform:translateY(8px)} 68.00% {opacity:1; transform:translateY(0)} 100% {opacity:1; transform:translateY(0)} }
    @keyframes glow { 0%, 100% {opacity:.55} 50% {opacity:.9} }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101219"/><stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.18" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#8b7bff" stop-opacity="0.28"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="typeclip"><rect x="64" y="244" height="30" width="0" style="animation:type 10s infinite steps(44)"/></clipPath>
  </defs>

  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="22" fill="url(#halo)" style="animation:glow 6s ease-in-out infinite"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="21.5" fill="none" stroke="#ffffff14"/>

  <!-- Logo + title -->
  <g transform="translate(64 66)">
    <rect width="60" height="60" rx="15" fill="#1a1c24" stroke="#ffffff14"/>
    <circle cx="26" cy="26" r="13" fill="none" stroke="#8b7bff" stroke-width="4"/>
    <path d="M35.5 35.5l10 10" stroke="#8b7bff" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 26h12M26 20v12" stroke="#e8eaf0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="142" y="112" class="sans" font-size="54" font-weight="700" fill="#e8eaf0" letter-spacing="-1.5">OptLens</text>
  <text x="64" y="170" class="sans" font-size="21" fill="#969caa">See what the compiler's optimizer did to your C program,</text>
  <text x="64" y="199" class="sans" font-size="21" fill="#969caa">and whether it <tspan fill="#e8eaf0" font-weight="600">changed its behaviour</tspan>.</text>

  <!-- Typed command -->
  <g class="dyn">
    <text x="64" y="265" class="mono" font-size="16" fill="#8b7bff" clip-path="url(#typeclip)" textLength="422" lengthAdjust="spacing"><tspan fill="#5f6573">$</tspan> optlens prog.c   # gcc+clang × -O0/-O2/-O3</text>
    <g style="animation:caret 10s infinite steps(44)">
      <rect x="66" y="250" width="9" height="19" fill="#8b7bff" style="animation:blink 1s infinite"/>
    </g>
  </g>

  <!-- Chips -->
  <g class="mono" font-size="13" fill="#969caa">
    <g transform="translate(64 302)"><rect width="92" height="28" rx="8" fill="#ffffff08" stroke="#ffffff14"/><text x="46.0" y="18.5" text-anchor="middle">GCC 13</text></g><g transform="translate(164 302)"><rect width="100" height="28" rx="8" fill="#ffffff08" stroke="#ffffff14"/><text x="50.0" y="18.5" text-anchor="middle">Clang 18</text></g><g transform="translate(272 302)"><rect width="92" height="28" rx="8" fill="#ffffff08" stroke="#ffffff14"/><text x="46.0" y="18.5" text-anchor="middle">ASan</text></g><g transform="translate(372 302)"><rect width="92" height="28" rx="8" fill="#ffffff08" stroke="#ffffff14"/><text x="46.0" y="18.5" text-anchor="middle">UBSan</text></g><g transform="translate(472 302)"><rect width="92" height="28" rx="8" fill="#ffffff08" stroke="#ffffff14"/><text x="46.0" y="18.5" text-anchor="middle">MSan</text></g><g transform="translate(572 302)"><rect width="92" height="28" rx="8" fill="#ffffff08" stroke="#ffffff14"/><text x="46.0" y="18.5" text-anchor="middle">Docker</text></g>
  </g>

  <!-- Compile matrix panel -->
  <rect x="690" y="44" width="466" height="292" rx="16" fill="#111318" stroke="#ffffff14"/>
  <text x="714" y="76" class="sans" font-size="14" font-weight="600" fill="#e8eaf0">Compile matrix</text>
  <text x="1132" y="76" class="mono" font-size="11" fill="#5f6573" text-anchor="end">same output? same exit code?</text>
  <path d="M690 90H1156" stroke="#ffffff14"/>
  <g class="dyn">
      <g>
        
        <text x="716" y="108" class="mono" font-size="14" fill="#e8eaf0">gcc   -O0</text>
        <rect x="840" y="100" width="150" height="6" rx="3" fill="#ffffff14"/>
        <rect x="840" y="100" width="150" height="6" rx="3" fill="#8b7bff" class="bar" style="animation:fill0 10s infinite"/>
        <g style="animation:show0 10s infinite">
          <text x="1024" y="108" class="mono" font-size="14" fill="#34d399">prints 1</text>
          <circle cx="1126" cy="103" r="5" fill="#34d399"/>
        </g>
      </g>
      <g>
        
        <text x="716" y="138" class="mono" font-size="14" fill="#e8eaf0">gcc   -O2</text>
        <rect x="840" y="130" width="150" height="6" rx="3" fill="#ffffff14"/>
        <rect x="840" y="130" width="150" height="6" rx="3" fill="#8b7bff" class="bar" style="animation:fill1 10s infinite"/>
        <g style="animation:show1 10s infinite">
          <text x="1024" y="138" class="mono" font-size="14" fill="#34d399">prints 1</text>
          <circle cx="1126" cy="133" r="5" fill="#34d399"/>
        </g>
      </g>
      <g>
        
        <text x="716" y="168" class="mono" font-size="14" fill="#e8eaf0">gcc   -O3</text>
        <rect x="840" y="160" width="150" height="6" rx="3" fill="#ffffff14"/>
        <rect x="840" y="160" width="150" height="6" rx="3" fill="#8b7bff" class="bar" style="animation:fill2 10s infinite"/>
        <g style="animation:show2 10s infinite">
          <text x="1024" y="168" class="mono" font-size="14" fill="#34d399">prints 1</text>
          <circle cx="1126" cy="163" r="5" fill="#34d399"/>
        </g>
      </g>
      <g>
        <rect x="700" y="179" width="446" height="28" rx="7" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.35" style="animation:flag 10s infinite"/>
        <text x="716" y="198" class="mono" font-size="14" fill="#fbbf24">clang -O0</text>
        <rect x="840" y="190" width="150" height="6" rx="3" fill="#ffffff14"/>
        <rect x="840" y="190" width="150" height="6" rx="3" fill="#8b7bff" class="bar" style="animation:fill3 10s infinite"/>
        <g style="animation:show3 10s infinite">
          <text x="1024" y="198" class="mono" font-size="14" fill="#fbbf24">prints 0</text>
          <circle cx="1126" cy="193" r="5" fill="#fbbf24"/>
        </g>
      </g>
      <g>
        
        <text x="716" y="228" class="mono" font-size="14" fill="#e8eaf0">clang -O2</text>
        <rect x="840" y="220" width="150" height="6" rx="3" fill="#ffffff14"/>
        <rect x="840" y="220" width="150" height="6" rx="3" fill="#8b7bff" class="bar" style="animation:fill4 10s infinite"/>
        <g style="animation:show4 10s infinite">
          <text x="1024" y="228" class="mono" font-size="14" fill="#34d399">prints 1</text>
          <circle cx="1126" cy="223" r="5" fill="#34d399"/>
        </g>
      </g>
      <g>
        
        <text x="716" y="258" class="mono" font-size="14" fill="#e8eaf0">clang -O3</text>
        <rect x="840" y="250" width="150" height="6" rx="3" fill="#ffffff14"/>
        <rect x="840" y="250" width="150" height="6" rx="3" fill="#8b7bff" class="bar" style="animation:fill5 10s infinite"/>
        <g style="animation:show5 10s infinite">
          <text x="1024" y="258" class="mono" font-size="14" fill="#34d399">prints 1</text>
          <circle cx="1126" cy="253" r="5" fill="#34d399"/>
        </g>
      </g>
    <g style="animation:verdict 10s infinite">
      <rect x="700" y="284" width="446" height="40" rx="10" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.45"/>
      <path d="M720 312l9-16 9 16z" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>
      <path d="M729 302v4M729 309v.5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <text x="748" y="309" class="sans" font-size="14" font-weight="700" fill="#fbbf24" letter-spacing="0.6">MISMATCH · UB</text>
      <text x="868" y="309" class="mono" font-size="12" fill="#969caa">UBSan: signed overflow, line 9</text>
    </g>
    <text x="1132" y="360" class="sans" font-size="12" fill="#5f6573" text-anchor="end" style="animation:flag 10s infinite">your bug, not the compiler's</text>
  </g>
</svg>
