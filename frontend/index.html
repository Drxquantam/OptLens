<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OptLens: see what the C optimizer did, and whether it changed your program." />
    <title>OptLens</title>
    <script>
      try {
        const t = localStorage.getItem('optlens.theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
