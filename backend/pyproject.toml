[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optlens"
version = "0.1.0"
description = "Differential testing of C compiler optimisations in a sandbox"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["optlens*"]

[tool.setuptools.package-data]
optlens = ["presets/*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs a real sandbox container (needs Docker + the sandbox image)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

